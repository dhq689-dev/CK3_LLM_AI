[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ck3-strategist"
version = "0.1.0"
description = "Parse CK3 saves into an LLM-consumable strategic world state"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["ck3_strategist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long JSON fixtures in tests

[tool.mypy]
python_version = "3.11"
files = ["ck3_strategist"]
